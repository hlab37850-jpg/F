plugins {
    id 'com.android.application'
}

android {
    namespace 'info.aalmoghalis.inventory'
    compileSdk 34

    defaultConfig {
        applicationId "info.aalmoghalis.inventory"
        minSdk 21
        targetSdk 34
        versionCode 170
        versionName "Inv1.170"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// إضافة مستودع JitPack ضروري لبعض المكتبات
repositories {
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    
    // المكتبات المفقودة التي تسبب أخطاء السمات:
    implementation 'androidx.percentlayout:percentlayout:1.0.0' // لـ layout_heightPercent
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0' // لـ zxing_* attributes
    implementation 'com.github.kyanogen:signatureview:1.2' // لـ penColor, enableSignature
    implementation 'com.github.nikartm:image-support:2.0.0' // لـ ibv_* attributes
}
